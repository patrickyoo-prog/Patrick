:root { color-scheme: dark; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {

  max-width: 520px;
  margin: 0 auto;
}
header {
  padding: 12px 16px;
  background: rgba(255,255,255,0.04);
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid rgba(255,255,255,0.07);

header .logo { font-size: 18px; }
header h1 { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
.badge {
  margin-left: auto;
  font-size: 10px;
  background: rgba(29,185,84,0.2);
  color: #1db954;
  padding: 3px 8px;
  border-radius: 10px;
  font-weight: 700;
}
.player-section { flex-shrink: 0; padding: 14px 14px 0; }
#yt-container {
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
}
#yt-player { width: 100%; height: 100%; }
.yt-placeholder {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: #444; gap: 8px; font-size: 13px;
  position: absolute; top: 0; left: 0;
  background: #111; z-index: 1;
}
.yt-placeholder .ph-icon { font-size: 36px; }
.now-playing { padding: 10px 14px 2px; }
.np-title {
  font-size: 15px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  letter-spacing: -0.01em;
}
.np-meta { font-size: 11px; color: #666; margin-top: 3px; }
.controls {
  padding: 10px 14px 12px;
  display: flex; align-items: center; gap: 8px;
}
.ctrl {
  border: none; cursor: pointer; border-radius: 8px;
  font-size: 13px; display: flex; align-items: center; justify-content: center;
  gap: 5px; transition: background 0.12s; color: #fff;
  background: rgba(255,255,255,0.07); padding: 8px 12px;
}
.ctrl:hover { background: rgba(255,255,255,0.13); }
.ctrl:active { transform: scale(0.95); }
.ctrl.icon-only { width: 40px; height: 40px; padding: 0; flex-shrink: 0; font-size: 16px; }
.ctrl.shuffle-on { background: rgba(29,185,84,0.2); color: #1db954; }
.ctrl.lyrics-on { background: rgba(29,185,84,0.2); color: #1db954; }
.ctrl.flex-grow { flex: 1; }
.ctrl#play-btn { flex: 0 0 48px; height: 48px; font-size: 18px; border-radius: 50%; background: #1db954; color: #000; }
.ctrl#play-btn:hover { background: #1ed760; }
/* Lyrics panel */
.lyrics-panel {
  display: none;
  padding: 14px 16px;
  border-top: 1px solid rgba(255,255,255,0.06);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  max-height: 260px;
  overflow-y: auto;
  background: rgba(255,255,255,0.015);
  flex-shrink: 0;
}
.lyrics-panel.visible { display: block; }
.lyrics-panel::-webkit-scrollbar { width: 3px; }
.lyrics-panel::-webkit-scrollbar-track { background: transparent; }
.lyrics-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
.lyrics-header {
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: #1db954; margin-bottom: 10px;
}
.lyrics-content {
  font-size: 13px;
  line-height: 2;
  color: #bbb;
  white-space: pre-wrap;
  word-break: keep-all;
}
.lyrics-empty {
  font-size: 12px;
  color: #555;
  text-align: center;
  padding: 16px 0;
  line-height: 1.8;
}
.divider { height: 1px; background: rgba(255,255,255,0.06); }
.pl-section { flex: 1; overflow-y: auto; min-height: 0; padding-bottom: 20px; }
.pl-header {
  padding: 10px 14px 6px;
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em; color: #555;
  position: sticky; top: 0; background: #141414; z-index: 2;
}
.song-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; cursor: pointer;
  transition: background 0.1s;
}
.song-item:hover { background: rgba(255,255,255,0.04); }
.song-item.active {
  background: rgba(29,185,84,0.08);
  border-left: 2px solid #1db954;
  padding-left: 12px;
}
.s-num { font-size: 11px; color: #555; width: 16px; text-align: right; flex-shrink: 0; }
.song-item.active .s-num { color: #1db954; }
.s-art {
  width: 40px; height: 40px; border-radius: 6px;
  background: #222; object-fit: cover; flex-shrink: 0;

.s-art-ph {
  width: 40px; height: 40px; border-radius: 6px;
  background: #222; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.s-info { flex: 1; min-width: 0; }
.s-title-wrap {
  display: flex; align-items: center; gap: 4px;
  white-space: nowrap; overflow: hidden;
}
.s-title {
  font-size: 13px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  min-width: 0;

.song-item.active .s-title { color: #1db954; }
.notion-link {

  font-size: 11px; color: #444;

  padding: 1px 3px; border-radius: 3px;

  line-height: 1;

.notion-link:hover { color: #888; background: rgba(255,255,255,0.07); }
.song-item.active .notion-link { color: #1db954; opacity: 0.7; }
.s-sub { font-size: 11px; color: #666; margin-top: 2px; }
</style>
</head>

<div class="pl-section">

let ytPlayer = null;
let playOrder = [];
let curIdx = 0;
let isShuffled = true;
let activeDataIdx = -1;
let lyricsVisible = false;

function esc(s) {
  return String(s || '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function buildOrder(keepDataIdx) {
  const n = SONGS.length;
  playOrder = Array.from({length: n}, (_, i) => i);
  if (isShuffled) {
    for (let i = n - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [playOrder[i], playOrder[j]] = [playOrder[j], playOrder[i]];
    }
  }
  if (keepDataIdx !== undefined && keepDataIdx >= 0) {
    const pos = playOrder.indexOf(keepDataIdx);
    curIdx = pos >= 0 ? pos : 0;
  } else {
    curIdx = 0;
  }
}

window.onYouTubeIframeAPIReady = function() {
  ytPlayer = new YT.Player('yt-player', {
    height: '100%', width: '100%',
    playerVars: { rel: 0, modestbranding: 1, playsinline: 1,
      origin: window.location.origin || 'https://raw.githack.com' },
    events: { onReady: onPlayerReady, onStateChange: onPlayerStateChange }
  });
};

function onPlayerReady() {
  document.getElementById('yt-placeholder').style.display = 'none';
  const params = new URLSearchParams(window.location.search);
  const startId = params.get('id');
  const startDataIdx = startId ? SONGS.findIndex(s => s.youtubeId === startId) : -1;
  if (startDataIdx >= 0) {
    buildOrder(startDataIdx);
    playSong(startDataIdx);
  } else {
    buildOrder();
    playSong(playOrder[0]);
  }
}

function onPlayerStateChange(event) {
  const state = event.data;
  if (state === YT.PlayerState.ENDED) playNext();
  document.getElementById('play-btn').textContent =
    state === YT.PlayerState.PLAYING ? '⏸' : '▶';
}

function playSong(dataIdx) {
  const song = SONGS[dataIdx];
  if (!song) return;
  activeDataIdx = dataIdx;
  if (ytPlayer && ytPlayer.loadVideoById) ytPlayer.loadVideoById(song.youtubeId);
  document.getElementById('np-title').textContent = song.title || '—';
  document.getElementById('np-meta').textContent =
    [song.artist, song.year ? song.year + '년' : ''].filter(Boolean).join(' · ');
  const pos = playOrder.indexOf(dataIdx);
  if (pos !== -1) curIdx = pos;
  document.querySelectorAll('.song-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.didx) === dataIdx);
  });
  updateLyricsPanel();
}

function playNext() {
  curIdx = (curIdx + 1) % playOrder.length;
  playSong(playOrder[curIdx]);
}

function playPrev() {
  curIdx = (curIdx - 1 + playOrder.length) % playOrder.length;
  playSong(playOrder[curIdx]);
}

function togglePlay() {
  if (!ytPlayer) return;
  const state = ytPlayer.getPlayerState();
  if (state === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
  else {
    if (activeDataIdx < 0) { buildOrder(); playSong(playOrder[0]); }
    else ytPlayer.playVideo();
  }
}

function toggleShuffle() {
  isShuffled = !isShuffled;
  const btn = document.getElementById('shuffle-btn');
  btn.classList.toggle('shuffle-on', isShuffled);
  btn.textContent = isShuffled ? '🔀 셔플' : '▶ 순서대로';
  buildOrder(activeDataIdx);
}

function toggleLyrics() {
  lyricsVisible = !lyricsVisible;
  const panel = document.getElementById('lyrics-panel');
  const btn = document.getElementById('lyrics-btn');
  panel.classList.toggle('visible', lyricsVisible);
  btn.classList.toggle('lyrics-on', lyricsVisible);
  if (lyricsVisible) updateLyricsPanel();
}

function updateLyricsPanel() {
  const body = document.getElementById('lyrics-body');
  if (activeDataIdx < 0) {
    body.innerHTML = '<div class="lyrics-empty">재생 중인 곡을 선택해 주세요</div>';
    return;
  }
  const song = SONGS[activeDataIdx];
  if (!song) return;
  if (song.lyrics) {
    body.innerHTML = '<div class="lyrics-content">' + esc(song.lyrics) + '</div>';
  } else {
    const isInstrumental = !song.lyrics &&
      (song.artist.includes('Khruangbin') || song.artist.includes('Chuck Mangione'));
    body.innerHTML = '<div class="lyrics-empty">' +
      (isInstrumental
        ? '🎷 연주곡입니다 (가사 없음)'
        : '📋 가사 정보를 준비 중입니다\n<span style="font-size:11px;color:#444">Notion 페이지에서 가사를 확인하세요</span>') +
      '</div>';
  }
}

function renderPlaylist() {
  document.getElementById('song-count-badge').textContent = `${SONGS.length}곡`;
  document.getElementById('pl-label').textContent = `플레이리스트 · ${SONGS.length}곡`;
  document.getElementById('pl-body').innerHTML = SONGS.map((s, i) => {
    const artHtml = s.albumArt
      ? `<img class="s-art" src="${esc(s.albumArt)}"
             onerror="this.outerHTML='<div class=\\'s-art-ph\\'>🎵</div>'" alt="">`
      : `<div class="s-art-ph">🎵</div>`;
    const notionBtn = s.notionUrl
      ? `<a class="notion-link" href="${esc(s.notionUrl)}" target="_blank"
           onclick="event.stopPropagation()" title="Notion 페이지 열기">📝</a>`
      : '';
    const lyricsTag = s.lyrics
      ? `<span style="font-size:9px;color:#555;margin-left:2px;flex-shrink:0" title="가사 있음">♪</span>`
      : '';
    return `
      <div class="song-item" data-didx="${i}" onclick="playSong(${i})">
        <span class="s-num">${i + 1}</span>
        ${artHtml}
        <div class="s-info">
          <div class="s-title-wrap">
            <span class="s-title">${esc(s.title)}</span>
            ${lyricsTag}
            ${notionBtn}
          </div>
          <div class="s-sub">${esc(s.artist)}${s.year ? ' · ' + s.year : ''}</div>
        </div>
      </div>`;
  }).join('');
}

renderPlaylist();
</script>
