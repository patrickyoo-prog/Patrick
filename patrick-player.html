<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrick's Daily Music Player - Auto-Sync</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .player-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        .loading-indicator {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }

        .album-art {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 15px;
            object-fit: cover;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .song-info {
            text-align: center;
            margin-bottom: 30px;
        }

        .song-title {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
            word-wrap: break-word;
        }

        .song-artist {
            font-size: 16px;
            color: #666;
            margin-bottom: 5px;
        }

        .song-year {
            font-size: 14px;
            color: #999;
        }

        .sync-status {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        .sync-status.synced {
            color: #4caf50;
        }

        .sync-status.syncing {
            color: #ff9800;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        button {
            background: none;
            border: none;
            font-size: 30px;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background: #f0f0f0;
            transform: scale(1.1);
        }

        button:active {
            transform: scale(0.95);
        }

        #prev-btn, #next-btn {
            font-size: 24px;
        }

        #play-btn {
            font-size: 40px;
        }

        .info-section {
            margin-bottom: 25px;
        }

        .info-section h3 {
            font-size: 14px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-bottom: 20px;
            cursor: pointer;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #999;
            margin-bottom: 20px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .volume-control input {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
            background: #e0e0e0;
        }

        .volume-control input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        .volume-control input::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .action-buttons button {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            border-radius: 8px;
            background: #f5f5f5;
            color: #333;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid #e0e0e0;
        }

        .action-buttons button:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .action-buttons button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #notion-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
        }

        #notion-btn:hover {
            background: linear-gradient(135deg, #5568d3 0%, #653a91 100%);
        }

        .youtube-link {
            text-align: center;
            margin-top: 20px;
        }

        .youtube-link a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: #ff0000;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .youtube-link a:hover {
            background: #cc0000;
            transform: scale(1.05);
        }

        .shuffle-repeat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .shuffle-repeat button {
            padding: 8px 12px;
            font-size: 12px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            color: #666;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .shuffle-repeat button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        @media (max-width: 600px) {
            .player-container {
                padding: 30px 20px;
            }

            .song-title {
                font-size: 20px;
            }

            .controls {
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="player-container">
        <h1 style="text-align: center; margin-bottom: 30px; color: #333;">🎵 Patrick's Daily Music</h1>

        <div id="content">
            <div class="loading-indicator">
                <div class="loading-spinner"></div>
                <p>플레이리스트 로드 중...</p>
            </div>
        </div>
    </div>

    <script>
        // Notion API 설정
        const NOTION_API_URL = 'https://api.notion.com/v1';
        const DATABASE_ID = '30ef1ab5-5fd7-463e-a333-e5e9b64fa8e8';
        // 주의: 프로덕션에서는 CORS 문제로 직접 API 호출이 불가능합니다.
        // 대신 Notion Public API 또는 서버 프록시를 사용하거나,
        // Patrick's Playlist DB의 공개 뷰를 사용해야 합니다.

        let SONGS = [];
        let currentIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        let repeatMode = 0;
        let audioPlayer = null;

        // 대체 방안: Notion 공개 데이터베이스 URL에서 정보 추출
        // 또는 별도 JSON 파일을 호스팅하는 방법

        async function loadPlaylistFromNotion() {
            try {
                updateSyncStatus('syncing');

                // GitHub에서 songs.json 로드 (Patrick's 리포지토리)
                // 주소: https://raw.githubusercontent.com/patrickyoo-prog/Patrick/main/songs.json
                const response = await fetch(
                    'https://raw.githubusercontent.com/patrickyoo-prog/Patrick/main/songs.json',
                    {
                        cache: 'no-store', // 항상 최신 데이터 로드
                        headers: {
                            'Accept': 'application/json'
                        }
                    }
                );

                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error('songs.json을 찾을 수 없습니다. GitHub에 파일이 있는지 확인하세요.');
                    }
                    throw new Error(`HTTP ${response.status}: 플레이리스트를 로드할 수 없습니다.`);
                }

                const data = await response.json();

                // songs.json 구조: { songs: [...] } 또는 { version, lastUpdated, songs, ... }
                SONGS = data.songs || data;

                if (!Array.isArray(SONGS) || SONGS.length === 0) {
                    throw new Error('플레이리스트가 비어있거나 올바른 형식이 아닙니다.');
                }

                console.log(`✅ 플레이리스트 로드 완료: ${SONGS.length}곡`);
                renderPlayer();
                updateSyncStatus('synced');
            } catch (error) {
                console.error('플레이리스트 로드 오류:', error);
                showError(`
                    <strong>플레이리스트를 로드할 수 없습니다</strong><br>
                    ${error.message}<br><br>
                    <small style="color: #666;">
                    확인 사항:<br>
                    • GitHub에 songs.json 파일이 있는가?<br>
                    • URL: https://github.com/patrickyoo-prog/Patrick/blob/main/songs.json<br>
                    • 인터넷 연결을 확인하세요
                    </small>
                `);
                updateSyncStatus('error');
            }
        }

        function showError(message) {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="error-message">
                    <strong>오류 발생</strong><br>
                    ${message}
                </div>
            `;
        }

        function updateSyncStatus(status) {
            const syncEl = document.querySelector('.sync-status');
            if (syncEl) {
                syncEl.className = `sync-status ${status}`;
                const now = new Date().toLocaleTimeString('ko-KR');
                if (status === 'synced') {
                    syncEl.textContent = `✅ 동기화됨 (${now})`;
                } else if (status === 'syncing') {
                    syncEl.textContent = `🔄 동기화 중...`;
                } else {
                    syncEl.textContent = `❌ 동기화 실패`;
                }
            }
        }

        function renderPlayer() {
            const content = document.getElementById('content');
            content.innerHTML = `
                <img id="albumArt" class="album-art" src="" alt="Album Art">

                <div class="song-info">
                    <div class="song-title" id="songTitle">Loading...</div>
                    <div class="song-artist" id="songArtist"></div>
                    <div class="song-year" id="songYear"></div>
                    <div class="sync-status synced">✅ Notion에서 동기화</div>
                </div>

                <audio id="audioPlayer" style="display: none;"></audio>

                <div class="info-section">
                    <h3>Progress</h3>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-display">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                </div>

                <div class="controls">
                    <button id="prev-btn">⏮</button>
                    <button id="play-btn">▶️</button>
                    <button id="next-btn">⏭</button>
                </div>

                <div class="shuffle-repeat">
                    <button id="shuffle-btn">🔀 Shuffle</button>
                    <button id="repeat-btn">🔁 Repeat</button>
                </div>

                <div class="info-section">
                    <h3>Volume</h3>
                    <div class="volume-control">
                        <span style="font-size: 14px;">🔊</span>
                        <input type="range" id="volumeControl" min="0" max="100" value="70">
                        <span style="font-size: 14px;">🔉</span>
                    </div>
                </div>

                <div class="action-buttons">
                    <button id="notion-btn" onclick="openNotionPage()" title="곡 정보 보기">📋 곡 정보</button>
                </div>

                <div class="youtube-link">
                    <a id="youtubeLink" href="" target="_blank">▶️ YouTube에서 보기</a>
                </div>

                <div style="text-align: center; margin-top: 20px; font-size: 11px; color: #999;">
                    <p>⚡ Notion Playlist DB에서 실시간 동기화</p>
                </div>
            `;

            setupEventListeners();
            loadSong();

            // URL 파라미터로 특정 곡 재생
            const urlParams = new URLSearchParams(window.location.search);
            const songId = urlParams.get('id');
            if (songId) {
                const index = SONGS.findIndex(song => song.youtubeId === songId);
                if (index !== -1) {
                    currentIndex = index;
                    loadSong();
                }
            }
        }

        function setupEventListeners() {
            audioPlayer = document.getElementById('audioPlayer');
            const playBtn = document.getElementById('play-btn');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const shuffleBtn = document.getElementById('shuffle-btn');
            const repeatBtn = document.getElementById('repeat-btn');
            const volumeControl = document.getElementById('volumeControl');
            const progressBar = document.querySelector('.progress-bar');

            playBtn.addEventListener('click', togglePlayPause);
            prevBtn.addEventListener('click', prevSong);
            nextBtn.addEventListener('click', nextSong);
            shuffleBtn.addEventListener('click', toggleShuffle);
            repeatBtn.addEventListener('click', toggleRepeat);
            volumeControl.addEventListener('input', (e) => {
                audioPlayer.volume = e.target.value / 100;
            });

            audioPlayer.addEventListener('timeupdate', updateProgress);
            audioPlayer.addEventListener('loadedmetadata', updateDuration);
            audioPlayer.addEventListener('ended', handleSongEnd);
            progressBar.addEventListener('click', seekTo);

            audioPlayer.volume = 0.7;
        }

        function loadSong() {
            const song = SONGS[currentIndex];
            if (!song) return;

            document.getElementById('songTitle').textContent = song.title;
            document.getElementById('songArtist').textContent = song.artist;
            document.getElementById('songYear').textContent = song.year;
            document.getElementById('albumArt').src = song.albumArt;
            document.getElementById('youtubeLink').href = `https://youtu.be/${song.youtubeId}`;

            // YouTube iframe 사용 (CORS 문제 해결)
            audioPlayer.src = `https://www.youtube.com/watch?v=${song.youtubeId}`;

            updateNotionButton();
        }

        function updateNotionButton() {
            const btn = document.getElementById('notion-btn');
            const song = SONGS[currentIndex];
            if (song && song.notionUrl) {
                btn.style.opacity = '1';
                btn.disabled = false;
            } else {
                btn.style.opacity = '0.3';
                btn.disabled = true;
            }
        }

        function openNotionPage() {
            const song = SONGS[currentIndex];
            if (song && song.notionUrl) {
                window.open(song.notionUrl, '_blank');
            }
        }

        function togglePlayPause() {
            const playBtn = document.getElementById('play-btn');
            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                playBtn.textContent = '▶️';
            } else {
                audioPlayer.play().catch(() => {
                    console.log('재생 권한 필요');
                });
                isPlaying = true;
                playBtn.textContent = '⏸';
            }
        }

        function prevSong() {
            currentIndex = (currentIndex - 1 + SONGS.length) % SONGS.length;
            loadSong();
            if (isPlaying) audioPlayer.play().catch(() => {});
        }

        function nextSong() {
            if (isShuffle) {
                currentIndex = Math.floor(Math.random() * SONGS.length);
            } else {
                currentIndex = (currentIndex + 1) % SONGS.length;
            }
            loadSong();
            if (isPlaying) audioPlayer.play().catch(() => {});
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('shuffle-btn').classList.toggle('active', isShuffle);
        }

        function toggleRepeat() {
            repeatMode = (repeatMode + 1) % 3;
            document.getElementById('repeat-btn').classList.toggle('active', repeatMode > 0);
        }

        function updateProgress() {
            const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            document.getElementById('progressFill').style.width = `${percent || 0}%`;
            document.getElementById('currentTime').textContent = formatTime(audioPlayer.currentTime);
        }

        function updateDuration() {
            document.getElementById('duration').textContent = formatTime(audioPlayer.duration);
        }

        function handleSongEnd() {
            if (repeatMode === 2) {
                audioPlayer.currentTime = 0;
                audioPlayer.play().catch(() => {});
            } else {
                nextSong();
            }
        }

        function seekTo(e) {
            const percent = e.offsetX / e.currentTarget.offsetWidth;
            audioPlayer.currentTime = percent * audioPlayer.duration;
        }

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // 페이지 로드 시 플레이리스트 불러오기
        window.addEventListener('load', loadPlaylistFromNotion);

        // 주기적으로 동기화 (5분마다)
        setInterval(async () => {
            updateSyncStatus('syncing');
            await loadPlaylistFromNotion();
        }, 5 * 60 * 1000);
    </script>
</body>
</html>
